name: Auto Scrape Multi Year

on:
  schedule:
    - cron: '0 0 1 * *' # Jalan otomatis setiap tanggal 1
  workflow_dispatch: # Tombol manual

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install axios cheerio

      - name: Run Scraper for Past, Present, and Future Year
        run: |
          # Menghitung tahun secara dinamis menggunakan perintah 'date'
          PREV_YEAR=$(date +%Y -d "last year")
          CURR_YEAR=$(date +%Y)
          NEXT_YEAR=$(date +%Y -d "next year")
          
          echo "Scraping years: $PREV_YEAR, $CURR_YEAR, $NEXT_YEAR"
          node scraper.js $PREV_YEAR $CURR_YEAR $NEXT_YEAR

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: Multiple Years $(date)" && git push)