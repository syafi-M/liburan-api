name: Auto Scrape Holiday Data

on:
  schedule:
    # Berjalan setiap tanggal 1 tiap bulan jam 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch: # Memungkinkan kamu menjalankan manual dari tombol di GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios cheerio

      - name: Run Scraper
        run: node scraper.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add holidays.json
          git commit -m "Automated update: $(date)" || exit 0
          git push
