name: Auto Scrape Holiday Data

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch: 
    inputs:
      year:
        description: 'Tahun untuk scraping (default: tahun ini)'
        required: true
        default: '2026'

# TAMBAHKAN INI: Memberi izin robot untuk menulis ke repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Update ke v4 (lebih stabil)

      - name: Setup Node.js
        uses: actions/setup-node@v4 # Update ke v4
        with:
          node-version: '20' # Gunakan Node 20 (LTS terbaru)

      - name: Install dependencies
        run: npm install axios cheerio

      - name: Run Scraper
        run: node scraper.js ${{ github.event.inputs.year || '2026' }}

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update holidays for ${{ github.event.inputs.year || '2026' }}" && git push)